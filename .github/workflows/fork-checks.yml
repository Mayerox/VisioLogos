name: Проверки ветки (форк)

on:
  push:
    branches:
      - 'voice/**'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run check

      - run: npx electron-vite build

  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: VisioLogos-win
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
